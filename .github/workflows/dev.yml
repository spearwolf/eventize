name: Continuous Integration

on:
  push:
    branches-ignore: [ "main" ]

jobs:
  test:
    name: Run tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - run: npm ci
        name: Install dependencies

      - run: npm run cbt
        name: Run cbt gate
